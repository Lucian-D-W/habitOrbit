[package]
name = "pulse-manager"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Lucian W. (lucian-d-w)"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.53.1", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
sha2 = "=0.10.9"
uuid = { version = "=1.26.0", features = ["v4"] }
tauri-plugin-single-instance = "=2.4.4"
windows-sys = { version = "0.61", features = ["Win32_Storage_Packaging_Appx", "Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
tauri-plugin-dialog = "=2.7.1"

[workspace]
